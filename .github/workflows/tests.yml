name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install --quiet --require-hashes -r .github/requirements/tests.txt
      - name: Run the suite with coverage that follows child processes
        run: |
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          printf 'import coverage; coverage.process_startup()\n' > "$SITE/coverage_subprocess.pth"
          COVERAGE_PROCESS_START="$PWD/.coveragerc" python -m coverage run -m pytest tests -q
          python -m coverage combine -q || true
          python -m coverage report | tee coverage.txt
      - name: Coverage floor
        run: python -m coverage report --fail-under=85
      - name: Job summary
        if: always()
        run: |
          { echo '### Coverage (Python ${{ matrix.python }})'; echo; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

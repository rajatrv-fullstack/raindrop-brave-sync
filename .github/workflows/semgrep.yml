name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (Python, JavaScript, bash, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the open-source CLI (no account, no token)
        run: python -m pip install --quiet --require-hashes -r .github/requirements/semgrep.txt
      - name: Scan
        run: |
          semgrep scan --error \
            --config p/python --config p/javascript --config p/secrets --config p/default \
            --sarif --output semgrep.sarif --metrics=off
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

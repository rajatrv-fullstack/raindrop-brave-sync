name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep (Python, JavaScript, bash, secrets)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan with the open-source engine (no account, no token)
        run: |
          semgrep scan \
            --config p/python --config p/javascript --config p/bash --config p/secrets \
            --sarif --output semgrep.sarif --metrics=off
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

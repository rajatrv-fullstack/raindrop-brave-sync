name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (Python, JavaScript, bash, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the open-source CLI (no account, no token)
        run: python -m pip install --quiet --require-hashes -r .github/requirements/semgrep.txt
      - name: Scan
        run: |
          semgrep scan --error \
            --config p/python --config p/javascript --config p/secrets --config p/default \
            --sarif --output semgrep.sarif --metrics=off
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

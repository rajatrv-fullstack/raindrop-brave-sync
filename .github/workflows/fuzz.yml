name: Fuzz

on:
  push:
    branches: [main]
    paths: ["src/**", "fuzz/**", ".github/workflows/fuzz.yml", ".github/requirements/fuzz.txt"]
  pull_request:
    branches: [main]
    paths: ["src/**", "fuzz/**", ".github/workflows/fuzz.yml", ".github/requirements/fuzz.txt"]
  schedule:
    - cron: "17 6 * * 1"   # weekly, longer budget
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: atheris (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_native_host, fuzz_bookmarks]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install atheris
        run: python -m pip install --quiet --require-hashes -r .github/requirements/fuzz.txt
      - name: Run the target
        # 45 seconds per target on every push; 10 minutes on the weekly schedule. Any contract
        # violation (an exception the target does not expect) fails the job and the input that
        # triggered it is uploaded below so it can be replayed locally.
        run: |
          BUDGET=45
          if [ "${{ github.event_name }}" = "schedule" ]; then BUDGET=600; fi
          mkdir -p corpus/${{ matrix.target }}
          python fuzz/${{ matrix.target }}.py -max_total_time="$BUDGET" -rss_limit_mb=2048 \
            -artifact_prefix=crash- corpus/${{ matrix.target }}
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}-crash
          path: crash-*
          if-no-files-found: ignore

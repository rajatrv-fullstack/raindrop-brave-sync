name: OSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "35 6 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      # The score and per-check results are published to scorecard.dev (see the README badge).
      # They are not uploaded to code scanning on purpose: that page is for findings in code,
      # and repository-process checks (review policy, project age, fuzzing) are not that.
